<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>动漫夯到拉 · Bangumi 分档榜</title><style>
:root{font-family:system-ui,-apple-system,"Microsoft Yahei",sans-serif;color:#eff2fa;background:#11131b}*{box-sizing:border-box}body{margin:0}header{padding:20px max(16px,calc((100vw - 1250px)/2));background:#1b2030;border-bottom:1px solid #353949}h1{font-size:24px;margin:0 0 6px}p{margin:6px 0;color:#aeb7c9;font-size:13px}main{max-width:1250px;margin:auto;padding:16px}button,input{font:inherit}button{border:1px solid #454e65;background:#30394f;color:white;border-radius:9px;padding:9px 12px;cursor:pointer}button:hover{background:#425373}button:disabled{opacity:.5}input{background:#181d2b;color:#fff;border:1px solid #46516c;border-radius:9px;padding:10px;min-width:0}.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:15px 0}.bar input{flex:1;min-width:140px}.hint{color:#aab5c7;font-size:12px;margin:5px 0 12px}.tiers{display:flex;flex-direction:column;gap:9px}.tier{display:grid;grid-template-columns:105px minmax(0,1fr);border:1px solid #384054;border-radius:12px;overflow:hidden;min-height:116px;background:#202638}.label{display:flex;align-items:center;justify-content:center;color:#1b202a;font-size:28px;font-weight:900;text-align:center;padding:10px}.tier[data-tier="夯"] .label{background:#f17e83}.tier[data-tier="顶级"] .label{background:#ffb274}.tier[data-tier="人上人"] .label{background:#f4da7a}.tier[data-tier="NPC"] .label{background:#9ee2a0}.tier[data-tier="拉"] .label{background:#9abde7}.dropzone{display:flex;align-items:center;align-content:flex-start;flex-wrap:wrap;gap:9px;padding:10px;min-height:115px}.dropzone.over,.pool.over{outline:3px dashed #8cb5ff;outline-offset:-5px;background:#263850}.empty{color:#67758a;font-size:13px}.panel{background:#1d2332;border:1px solid #353c52;border-radius:13px;padding:15px;margin-top:20px}.panel h2{font-size:18px;margin:0}.pool{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;min-height:145px;padding:14px 0}.anime{position:relative;width:91px;display:flex;flex-direction:column;gap:5px;flex-shrink:0;cursor:grab;user-select:none;touch-action:none}.anime img,.cover{width:91px;height:118px;object-fit:cover;background:#42485b;border-radius:6px;box-shadow:0 2px 8px #0005;pointer-events:none}.cover{display:grid;place-items:center;font-weight:700;font-size:22px;color:#aeb7c9}.anime .name{font-size:12px;line-height:1.35;max-height:33px;overflow:hidden;text-align:center;overflow-wrap:anywhere}.anime.selected{outline:2px solid #92baff;outline-offset:5px;border-radius:4px}.anime.dragging{opacity:.3}.ghost{position:fixed;z-index:9999;pointer-events:none;opacity:.93;filter:drop-shadow(0 8px 16px #0009);transform:scale(.95)}.small{font-size:12px;color:#afbbcc}.status{font-size:13px;color:#b9d1f7;min-height:20px;margin:10px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.right{margin-left:auto}a{color:#a9c5ff}.btnDanger{border-color:#774856}.search-results{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}.result{width:110px;display:flex;flex-direction:column;align-items:center;gap:5px;background:#262e40;border:1px solid #3c465b;padding:8px}.result img{width:80px;height:100px;object-fit:cover}.result span{font-size:12px;max-width:95px;overflow-wrap:anywhere}#msg{white-space:pre-wrap}.tierCount{font-size:12px;opacity:.7;font-weight:500}@media(max-width:600px){header{padding:14px}h1{font-size:20px}.tier{grid-template-columns:65px minmax(0,1fr);min-height:100px}.label{font-size:19px;writing-mode:vertical-rl}.anime{width:69px}.anime img,.cover{width:69px;height:91px}.anime .name{font-size:11px}.dropzone{min-height:100px;gap:8px}.panel{padding:12px}}
</style></head><body><header><h1>动漫「夯 → 拉」分档榜</h1><p>从 Bangumi 导入看过的动画 · 搜索添加 · 拖入不同等级 · 自动保存到本机</p></header><main><div class="bar"><input id="username" placeholder="Bangumi 用户名或数字 UID（例如 sai）"><button id="load">导入我的「看过」</button><button id="backup">导出备份</button><button id="restore">导入备份</button><input type="file" id="file" accept="application/json,.json" hidden></div><div class="status" id="msg" aria-live="polite"></div><div class="hint">手机/平板：长按卡片拖动到档位，或先点选一张封面再点击目标档位。点击榜单中的卡片可移回候选区。</div><section id="tiers" class="tiers"></section><section class="panel"><div class="bar"><h2>候选动漫 <span class="small" id="poolCount"></span></h2><button class="right" id="clear">清空分档（回候选区）</button></div><div class="bar"><input id="filter" placeholder="筛选现有候选动漫名称"><input id="keyword" placeholder="搜索 Bangumi 全站动画"><button id="search">搜索并添加</button></div><div id="results" class="search-results"></div><div id="pool" class="pool" data-dest="pool"></div></section><p>数据仅保存于当前浏览器（localStorage），不会写回 Bangumi。跨设备请用「导出备份 / 导入备份」。公开收藏通常无需登录；搜索和导入依赖 Bangumi API 连通性。<a href="https://bangumi.tv" target="_blank" rel="noopener">Bangumi</a></p></main><script>
(()=>{'use strict';const KEY='bangumi-tier-list-v1';const levels=['夯','顶级','人上人','NPC','拉'];let items={},groups=Object.fromEntries(['pool',...levels].map(x=>[x,[]]));let selected=null,drag=null;const $=id=>document.getElementById(id);const msg=s=>{$('msg').textContent=s};const normalize=s=>String(s||'').trim();function save(){try{localStorage.setItem(KEY,JSON.stringify({items,groups,username:$('username').value}))}catch(e){msg('保存失败：'+e.message)}}function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.items&&x.groups){items=x.items;for(const k of ['pool',...levels])groups[k]=Array.isArray(x.groups[k])?x.groups[k].map(String).filter(id=>items[id]):[];$('username').value=x.username||''}}catch(e){msg('读取本地数据失败')}}function unique(){let seen=new Set();for(const k of [...levels,'pool'])groups[k]=groups[k].filter(id=>{if(seen.has(id)||!items[id])return false;seen.add(id);return true});for(const id of Object.keys(items))if(!seen.has(id))groups.pool.push(id)}function createCard(id){const a=items[id],el=document.createElement('div');el.className='anime'+(selected===id?' selected':'');el.dataset.id=id;el.title=a.name;const im=document.createElement('img');if(a.image){im.src=a.image;im.alt='';im.loading='lazy';im.referrerPolicy='no-referrer';im.onerror=()=>{im.replaceWith(makeFallback())}}else el.append(makeFallback());if(a.image)el.append(im);const tx=document.createElement('div');tx.className='name';tx.textContent=a.name;el.append(tx);el.addEventListener('click',e=>{if(Date.now()-suppressClick<350)return;e.stopPropagation();if(selected===id){const zone=findZone(id);if(zone!=='pool')move(id,'pool');selected=null}else selected=id;render()});el.addEventListener('pointerdown',startPointer);return el}function makeFallback(){const x=document.createElement('div');x.className='cover';x.textContent='动画';return x}function findZone(id){return Object.keys(groups).find(k=>groups[k].includes(id))||'pool'}function move(id,to,before){const from=findZone(id);groups[from]=groups[from].filter(x=>x!==id);const dst=groups[to];const n=before&&dst.includes(before)?dst.indexOf(before):dst.length;dst.splice(n,0,id);selected=null;save();render()}function render(){unique();const wrap=$('tiers');wrap.replaceChildren();for(const level of levels){const row=document.createElement('div');row.className='tier';row.dataset.tier=level;const label=document.createElement('div');label.className='label';label.textContent=level;const list=document.createElement('div');list.className='dropzone';list.dataset.dest=level;list.append(...groups[level].map(createCard));if(!groups[level].length){const hint=document.createElement('span');hint.className='empty';hint.textContent='拖动漫封面到这里';list.append(hint)}row.append(label,list);row.addEventListener('click',e=>{if(selected&&!e.target.closest('.anime'))move(selected,level)});wrap.append(row)}const q=normalize($('filter').value).toLowerCase();$('pool').replaceChildren(...groups.pool.filter(id=>items[id].name.toLowerCase().includes(q)).map(createCard));$('poolCount').textContent=`(${groups.pool.length} 部)`;if(!groups.pool.length)$('pool').textContent='候选区为空：请导入或搜索添加动画。'}let suppressClick=0;function startPointer(e){if(e.button!==0)return;const el=e.currentTarget,id=el.dataset.id;const sx=e.clientX,sy=e.clientY;const pointerId=e.pointerId;let moving=false,ghost=null;const onMove=ev=>{if(ev.pointerId!==pointerId)return;const distance=Math.hypot(ev.clientX-sx,ev.clientY-sy);if(!moving&&distance>9){moving=true;ghost=el.cloneNode(true);ghost.classList.add('ghost');ghost.style.width=el.offsetWidth+'px';document.body.append(ghost);el.classList.add('dragging')}if(moving){ev.preventDefault();ghost.style.left=(ev.clientX-ghost.offsetWidth/2)+'px';ghost.style.top=(ev.clientY-48)+'px';document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));const zone=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('[data-dest]');if(zone)zone.classList.add('over')}};const onEnd=ev=>{if(ev.pointerId!==pointerId)return;el.removeEventListener('pointermove',onMove);el.removeEventListener('pointerup',onEnd);el.removeEventListener('pointercancel',onEnd);if(ghost)ghost.remove();el.classList.remove('dragging');document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));if(moving){suppressClick=Date.now();const target=document.elementFromPoint(ev.clientX,ev.clientY);const z=target?.closest('[data-dest]');if(z){const other=target.closest('.anime');move(id,z.dataset.dest,other?.dataset.id!==id?other?.dataset.id:null)}}};el.setPointerCapture(pointerId);el.addEventListener('pointermove',onMove);el.addEventListener('pointerup',onEnd);el.addEventListener('pointercancel',onEnd)}function ingest(a){const id=String(a.id||a.subject_id||'');if(!id)return false;const subject=a.subject||a;const name=normalize(subject.name_cn)||normalize(subject.name)||'未命名动画';const images=subject.images||{};const image=images.large||images.common||images.medium||images.small||subject.image||'';if(items[id]){if(!items[id].image&&image)items[id].image=image;return false}items[id]={id,name,image};groups.pool.push(id);return true}async function request(url,opts){const r=await fetch(url,opts);if(!r.ok)throw Error('HTTP '+r.status+(r.status===429?'（请求过于频繁）':''));return r.json()}$('load').onclick=async()=>{const name=normalize($('username').value);if(!name){msg('请先填写 Bangumi 用户名或数字 UID');return}const b=$('load');b.disabled=true;let added=0;try{for(let offset=0;offset<5000;offset+=50){msg(`导入中：已读取 ${offset} 条，新增 ${added} 部…`);const url='https://api.bgm.tv/v0/users/'+encodeURIComponent(name)+'/collections?subject_type=2&type=2&limit=50&offset='+offset;const data=await request(url);const arr=data.data||[];for(const c of arr)if(ingest(c))added++;save();render();if(arr.length<50||offset+50>=data.total)break;await new Promise(r=>setTimeout(r,180))}msg(`导入完成：新增 ${added} 部「看过」动画。`)}catch(e){msg(`导入中断：${e.message}。请检查用户名、公开收藏和 Bangumi API 连通性。已导入的条目会保留。`)}finally{b.disabled=false}};$('search').onclick=async()=>{const word=normalize($('keyword').value);if(!word){msg('请输入动画名称');return}const btn=$('search');btn.disabled=true;$('results').textContent='搜索中…';try{const data=await request('https://api.bgm.tv/v0/search/subjects?limit=30&offset=0',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({keyword:word,filter:{type:[2]}})});const box=$('results');box.replaceChildren();const arr=data.data||[];if(!arr.length)box.textContent='没有找到匹配的动画';for(const a of arr){const b=document.createElement('button');b.className='result';const image=a.images?.small||a.images?.medium||a.images?.common;if(image){const im=document.createElement('img');im.src=image;im.alt='';im.loading='lazy';b.append(im)}const label=document.createElement('span');label.textContent=(a.name_cn||a.name||'未命名')+(items[String(a.id)]?' ✓ 已添加':' + 添加');b.append(label);b.onclick=()=>{const added=ingest(a);save();render();msg(added?'已加入候选区：'+(a.name_cn||a.name):'该动画已在候选区或榜单中');label.textContent=(a.name_cn||a.name)+' ✓ 已添加'};box.append(b)}msg(`搜索完成：${arr.length} 个结果`)}catch(e){$('results').replaceChildren();msg('搜索失败：'+e.message+'。可尝试在正常联网的浏览器中打开网页。')}finally{btn.disabled=false}};$('keyword').addEventListener('keydown',e=>{if(e.key==='Enter')$('search').click()});$('filter').addEventListener('input',render);$('clear').onclick=()=>{if(!confirm('将所有档位中的动画移回候选区？'))return;groups.pool.push(...levels.flatMap(k=>{const x=groups[k];groups[k]=[];return x}));save();render()};$('backup').onclick=()=>{const obj={version:1,items,groups,username:$('username').value};const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='我的动漫夯到拉排行榜.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)};$('restore').onclick=()=>$('file').click();$('file').onchange=async e=>{try{const x=JSON.parse(await e.target.files[0].text());if(!x.items||!x.groups||!Array.isArray(x.groups.pool))throw Error('文件格式不匹配');items=x.items;groups=x.groups;for(const k of ['pool',...levels])if(!Array.isArray(groups[k]))groups[k]=[];$('username').value=x.username||'';unique();save();render();msg('备份导入成功')}catch(err){msg('导入失败：'+err.message)}e.target.value=''};load();render()})();
</script></body></html>
